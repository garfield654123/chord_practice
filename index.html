<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="和弦練習">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
  <title>和弦練習</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/ios-pwa.js"></script>
</head>
<body>
  <div id="app">

    <!-- 頂部標題列 -->
    <header class="app-header">
      <div class="header-left">
        <button id="sidebarToggle" class="icon-btn" aria-label="選單">☰</button>
        <h1>🎹 和弦練習</h1>
      </div>
      <div class="header-actions">
        <button id="refreshBtn"  class="icon-btn" aria-label="換一題">🔄</button>
        <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙️</button>
      </div>
    </header>

    <!-- 側邊欄遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 側邊欄導覽（練習／查詢／知識三個獨立頁面） -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">🎹 和弦練習</span>
        <button id="sidebarClose" class="icon-btn" aria-label="關閉選單">✕</button>
      </div>
      <button class="sidebar-item active" data-view="practice">
        <span class="sidebar-item-icon">🎯</span><span>練習</span>
      </button>
      <button class="sidebar-item" data-view="lookup">
        <span class="sidebar-item-icon">🔍</span><span>和弦查詢</span>
      </button>
      <button class="sidebar-item" data-view="knowledge">
        <span class="sidebar-item-icon">📖</span><span>和弦知識</span>
      </button>
    </nav>

    <!-- 設定面板 -->
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-content">
        <h2>設定</h2>

        <!-- 練習類型 -->
        <div class="setting-group">
          <label>練習類型 <span class="label-hint">（可複選，至少一項）</span></label>
          <div id="categoryList" class="category-list"></div>
        </div>

        <!-- 調性 -->
        <div class="setting-group">
          <label>調性</label>
          <div class="key-selector" id="keySelector">
            <button class="key-btn active" data-key="0">C</button>
            <button class="key-btn" data-key="1">C#/Db</button>
            <button class="key-btn" data-key="2">D</button>
            <button class="key-btn" data-key="3">D#/Eb</button>
            <button class="key-btn" data-key="4">E</button>
            <button class="key-btn" data-key="5">F</button>
            <button class="key-btn" data-key="6">F#/Gb</button>
            <button class="key-btn" data-key="7">G</button>
            <button class="key-btn" data-key="8">G#/Ab</button>
            <button class="key-btn" data-key="9">A</button>
            <button class="key-btn" data-key="10">A#/Bb</button>
            <button class="key-btn" data-key="11">B</button>
          </div>
        </div>

        <!-- 和弦範圍（僅對三和弦、七和弦有效） -->
        <div class="setting-group">
          <label>和弦範圍 <span class="label-hint">（三/七和弦有效）</span></label>
          <div class="toggle-group">
            <button class="toggle-btn active" id="diatonicBtn">調內和弦</button>
            <button class="toggle-btn" id="allChordsBtn">所有和弦</button>
          </div>
        </div>

        <!-- 輸入模式 -->
        <div class="setting-group">
          <label>輸入模式</label>
          <div class="toggle-group">
            <button class="toggle-btn active" id="pianoModeBtn">鋼琴鍵盤</button>
            <button class="toggle-btn" id="notationModeBtn">簡譜</button>
          </div>
        </div>

        <!-- 聽和弦方式 -->
        <div class="setting-group">
          <label>聽和弦方式</label>
          <div class="toggle-group">
            <button class="toggle-btn" id="chordPlayBtn">同時播放</button>
            <button class="toggle-btn active" id="arpPlayBtn">琶音播放</button>
          </div>
        </div>

        <!-- 底部按鈕 -->
        <button id="resetStatsBtn" class="reset-btn">重置統計資料</button>
        <button id="closeSettingsBtn" class="primary-btn">確定</button>
      </div>
    </div>

    <!-- 頁籤內容（左右滑動切換） -->
    <div class="view-stack" id="viewStack">

    <!-- 主練習區 -->
    <main class="practice-area view-page" id="practiceView">

      <div class="view-content">

        <!-- 分數列 -->
        <div class="score-bar">
          <div class="score-item">
            <span class="score-label">正確</span>
            <span class="score-value" id="correctCount">0</span>
          </div>
          <div class="score-item">
            <span class="score-label">錯誤</span>
            <span class="score-value" id="wrongCount">0</span>
          </div>
          <div class="score-item">
            <span class="score-label">連續</span>
            <span class="score-value" id="streakCount">0</span>
          </div>
        </div>

        <!-- 題目顯示 -->
        <div class="chord-display">
          <button id="hintToggleBtn" class="hint-toggle-btn" aria-label="提示">💡</button>
          <div class="category-badge" id="categoryBadge">三和弦</div>
          <div class="current-key" id="currentKeyDisplay">Key: C</div>
          <div class="chord-name" id="chordNameDisplay">--</div>
          <div class="chord-type" id="chordTypeDisplay"></div>
          <div class="chord-extra hidden" id="chordExtraDisplay"></div>
          <div class="chord-jianpu" id="chordJianpuDisplay"></div>
          <div class="chord-staff hidden" id="chordStaffDisplay"></div>
        </div>

        <!-- 回饋訊息 -->
        <div class="feedback hidden" id="feedback">
          <div class="feedback-icon" id="feedbackIcon"></div>
          <div class="feedback-text" id="feedbackText"></div>
          <div class="feedback-detail" id="feedbackDetail"></div>
        </div>

        <!-- 已選音符 -->
        <div class="selected-display" id="selectedDisplay">
          <span class="selected-label">已選：</span>
          <span class="selected-notes" id="selectedNotesText">尚未選擇</span>
        </div>

        <!-- 操作按鈕 -->
        <div class="action-buttons">
          <button id="clearBtn"        class="action-btn secondary-btn">清除</button>
          <button id="playSelectedBtn" class="action-btn secondary-btn">🎵 試聽</button>
          <button id="listenBtn"       class="action-btn secondary-btn">🔊 聽題</button>
        </div>
        <div class="action-buttons" style="margin-top:8px">
          <button id="submitBtn" class="action-btn primary-btn full-width">送出答案</button>
          <button id="nextBtn"   class="action-btn primary-btn full-width hidden">下一題 →</button>
        </div>

      </div>

      <!-- 鍵盤固定區（滿版、貼底，跟查詢頁的 88 鍵鋼琴同一套結構） -->
      <div class="keyboard-tray">
        <!-- 鋼琴鍵盤（可橫向捲動） -->
        <div class="pw-scroll" id="pianoScroll">
          <div id="pianoContainer"></div>
        </div>
        <!-- 簡譜 -->
        <div id="notationContainer" class="input-container hidden"></div>
      </div>

    </main>

    <!-- 和弦查詢頁 -->
    <section class="lookup-area view-page hidden" id="lookupView">

      <div class="view-content">

        <!-- 調性（預設折疊） -->
        <details class="lookup-key-group" id="lookupKeyGroup">
          <summary class="lookup-key-summary">
            <span class="lookup-key-summary-label">調性</span>
            <span class="lookup-key-summary-value" id="lookupKeySummaryValue">C</span>
            <span class="lookup-key-chevron">▾</span>
          </summary>
          <div class="key-selector" id="lookupKeySelector">
            <button class="key-btn active" data-key="0">C</button>
            <button class="key-btn" data-key="1">C#/Db</button>
            <button class="key-btn" data-key="2">D</button>
            <button class="key-btn" data-key="3">D#/Eb</button>
            <button class="key-btn" data-key="4">E</button>
            <button class="key-btn" data-key="5">F</button>
            <button class="key-btn" data-key="6">F#/Gb</button>
            <button class="key-btn" data-key="7">G</button>
            <button class="key-btn" data-key="8">G#/Ab</button>
            <button class="key-btn" data-key="9">A</button>
            <button class="key-btn" data-key="10">A#/Bb</button>
            <button class="key-btn" data-key="11">B</button>
          </div>
        </details>

        <!-- 辨識結果 -->
        <div class="chord-display">
          <div class="chord-name" id="lookupChordName">--</div>
          <div class="chord-type" id="lookupNotesText">尚未按任何琴鍵</div>
          <div class="chord-staff hidden" id="lookupStaffDisplay"></div>
        </div>

        <div class="action-buttons" style="margin-top:10px">
          <button id="lookupClearBtn"  class="action-btn secondary-btn">清除</button>
          <button id="lookupCenterBtn" class="action-btn secondary-btn">回到中央 C4</button>
        </div>

      </div>

      <!-- 鍵盤固定區（滿版、貼底） -->
      <div class="keyboard-tray">
        <div class="pw-scroll" id="pianoWideScroll">
          <div id="pianoWideContainer"></div>
        </div>
      </div>

    </section>

    <!-- 和弦知識頁 -->
    <section class="knowledge-area view-page hidden" id="knowledgeView">

      <div class="view-content">

        <!-- 簡介 -->
        <div class="knowledge-intro">
          <h2>怎麼讀和弦符號？</h2>
          <p>順序是：<strong>根音</strong> →
            <strong>性質</strong>（大 / 小 / 屬 / 減 / 增）→
            <strong>延伸音</strong>（7、9、11…）→
            <strong>低音</strong>（斜線和弦）。<br>
            例如 <code>Cm7/G</code> ＝ 根音 C、小七和弦、低音改成 G。</p>
        </div>

        <!-- 範例卡（會隨下方選擇即時更新） -->
        <div class="chord-display" id="knowledgeCard">
          <div class="chord-name" id="knowledgeSymbol">--</div>
          <div class="chord-type" id="knowledgeName"></div>
          <div class="knowledge-formula" id="knowledgeFormula"></div>
          <div class="knowledge-desc" id="knowledgeDesc"></div>
          <div class="chord-staff" id="knowledgeStaffDisplay"></div>
        </div>

        <!-- 根音 -->
        <div class="setting-group">
          <label>根音</label>
          <div class="key-selector" id="knowledgeRootSelector">
            <button class="key-btn active" data-key="0">C</button>
            <button class="key-btn" data-key="1">C#/Db</button>
            <button class="key-btn" data-key="2">D</button>
            <button class="key-btn" data-key="3">D#/Eb</button>
            <button class="key-btn" data-key="4">E</button>
            <button class="key-btn" data-key="5">F</button>
            <button class="key-btn" data-key="6">F#/Gb</button>
            <button class="key-btn" data-key="7">G</button>
            <button class="key-btn" data-key="8">G#/Ab</button>
            <button class="key-btn" data-key="9">A</button>
            <button class="key-btn" data-key="10">A#/Bb</button>
            <button class="key-btn" data-key="11">B</button>
          </div>
        </div>

        <!-- 低音（選填，示範轉位／複合和弦） -->
        <div class="setting-group">
          <label>低音 <span class="label-hint">（選填，示範轉位／複合和弦，如 C/E）</span></label>
          <select id="knowledgeBassSelect" class="knowledge-bass-select">
            <option value="" selected>原位（不變）</option>
            <option value="0">C</option>
            <option value="1">C#/Db</option>
            <option value="2">D</option>
            <option value="3">D#/Eb</option>
            <option value="4">E</option>
            <option value="5">F</option>
            <option value="6">F#/Gb</option>
            <option value="7">G</option>
            <option value="8">G#/Ab</option>
            <option value="9">A</option>
            <option value="10">A#/Bb</option>
            <option value="11">B</option>
          </select>
        </div>

        <!-- 和弦符號分類清單 -->
        <div class="knowledge-groups" id="knowledgeGroups"></div>

      </div>

    </section>

    </div>
  </div>

  <!-- iOS「加入主畫面」引導（iOS Safari 沒有原生安裝提示，需手動引導） -->
  <div id="iosInstallBanner" class="ios-install-banner hidden">
    <span class="ios-install-text">📲 點下方「分享」按鈕 <strong>⬆️</strong>，再選「加入主畫面」即可安裝成 App</span>
    <button id="iosInstallDismiss" class="ios-install-dismiss" aria-label="關閉">✕</button>
  </div>

  <!-- 提示彈窗 -->
  <div id="hintModal" class="hint-modal hidden">
    <div class="hint-modal-card">
      <div class="hint-modal-header">
        <span class="hint-modal-title">💡 和弦提示</span>
        <button id="hintModalClose" class="hint-modal-close" aria-label="關閉">✕</button>
      </div>
      <div id="hintModalContent" class="hint-modal-content"></div>
    </div>
  </div>

  <script src="js/chord.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/notation.js"></script>
  <script src="js/vendor/vexflow-bravura.js"></script>
  <script src="js/staff.js"></script>
  <script src="js/piano-wide.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lookup.js"></script>
  <script src="js/knowledge.js"></script>
</body>
</html>
